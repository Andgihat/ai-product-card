[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
# E501 — длину строк контролирует форматтер, а не линтер.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# В тестах магические числа читаются лучше констант.
"tests/*" = ["PLR2004"]
# Depends() в значениях по умолчанию — штатный способ внедрения зависимостей в FastAPI.
"app/main.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
